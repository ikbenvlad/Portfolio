name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Portfolio
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Portfolio/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Publish dist to gh-pages
        run: npx gh-pages -d dist -x -m "Deploy ${GITHUB_SHA}" -u "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" -r "https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
